<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/assets/css/site.css">
  <script>
    try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body class="{% if page.url == '/' %}home{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="wordmark" href="/">Renjitha K</a>
      <nav aria-label="Primary">
        <a href="/#about">About</a>
        <a href="/#experiments">Experiments</a>
        <a href="/#work">Case studies</a>
        <a href="/writing/">Writing</a>
        <a href="/#contact">Contact</a>
      </nav>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Use dark theme">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>© {{ site.time | date: "%Y" }} Renjitha K, Bengaluru</span>
      <span class="footer-links">
        <a href="{{ site.links.github }}">GitHub</a>
        <a href="{{ site.links.linkedin }}">LinkedIn</a>
        <a href="{{ site.links.hashnode }}">Hashnode</a>
        <a href="/feed.xml">RSS</a>
      </span>
    </div>
  </footer>

  <script>
    (function () {
      var root = document.documentElement;
      var toggle = document.getElementById("theme-toggle");
      function isDark() { return root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
      function label() { toggle.setAttribute("aria-label", isDark() ? "Use light theme" : "Use dark theme"); }
      toggle.addEventListener("click", function () {
        root.dataset.theme = isDark() ? "light" : "dark";
        try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>
</html>
