title: Renjitha K
description: Data platform engineer and technical lead. Builds data platforms, tests when they can be trusted, and writes to make tech concepts easier.
author: Renjitha K
url: "https://renjithak-swe.github.io"
baseurl: ""
lang: en

links:
  github: https://github.com/renjithak-swe
  linkedin: https://www.linkedin.com/in/renjitha-k/
  hashnode: https://renjithak.hashnode.dev
  email: renjithak0@gmail.com

markdown: kramdown
highlighter: rouge
kramdown:
