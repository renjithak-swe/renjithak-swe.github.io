<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-label="Percent change in each answer when capped homes are assumed to be worth more">

<style>
  .surface { fill: #fcfcfb; }
  .ink { fill: #0b0b0b; } .ink-2 { fill: #52514e; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #b9b8b2; stroke-width: 1; }
  .bar { fill: #86b6ef; } .cap { fill: #eb6834; }
  .s1 { fill: #9ec5f4; } .s2 { fill: #3987e5; } .s3 { fill: #184f95; }
  text { font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 13px; }
  .title { font-size: 15px; font-weight: 600; }
  .small { font-size: 12px; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink { fill: #f0efec; } .ink-2 { fill: #c3c2b7; }
    .grid { stroke: #2f2f2d; } .axis { stroke: #55544f; }
    .bar { fill: #3987e5; } .cap { fill: #d95926; }
    .s1 { fill: #6da7ec; } .s2 { fill: #3987e5; } .s3 { fill: #cde2fb; }
  }
</style>

<rect class="surface" width="760" height="372"/>
<text class="ink title" x="24" y="24">How much does each answer change?</text>
<text class="ink-2 small" x="24" y="42">Change from the recorded answer if capped homes are really worth more than the cap</text>
<rect class="s1" x="24.0" y="58" width="12" height="12" rx="2"/>
<text class="ink small" x="42.0" y="68">worth 1.2× the cap</text>
<rect class="s2" x="174.0" y="58" width="12" height="12" rx="2"/>
<text class="ink small" x="192.0" y="68">worth 1.5× the cap</text>
<rect class="s3" x="324.0" y="58" width="12" height="12" rx="2"/>
<text class="ink small" x="342.0" y="68">worth 2× the cap</text>
<line class="grid" x1="250.0" x2="250.0" y1="92" y2="300"/>
<text class="ink-2 small" x="250.0" y="318" text-anchor="middle">+0%</text>
<line class="grid" x1="363.5" x2="363.5" y1="92" y2="300"/>
<text class="ink-2 small" x="363.5" y="318" text-anchor="middle">+20%</text>
<line class="grid" x1="477.0" x2="477.0" y1="92" y2="300"/>
<text class="ink-2 small" x="477.0" y="318" text-anchor="middle">+40%</text>
<line class="grid" x1="590.5" x2="590.5" y1="92" y2="300"/>
<text class="ink-2 small" x="590.5" y="318" text-anchor="middle">+60%</text>
<line class="grid" x1="704.0" x2="704.0" y1="92" y2="300"/>
<text class="ink-2 small" x="704.0" y="318" text-anchor="middle">+80%</text>
<line class="axis" x1="250" x2="250" y1="92" y2="300"/>
<text class="ink" x="238" y="122.0" text-anchor="end">Q1 · median value</text>
<text class="ink-2 small" x="256" y="122.0">no change in any scenario</text>
<text class="ink" x="238" y="174.0" text-anchor="end">Q2 · share worth $400k+</text>
<text class="ink-2 small" x="256" y="174.0">no change in any scenario</text>
<text class="ink" x="238" y="226.0" text-anchor="end">Q4 · avg value, high-income areas</text>
<rect class="s1" x="250.0" y="205.0" width="78.7" height="10.0" rx="2"/>
<rect class="s2" x="250.0" y="217.0" width="196.7" height="10.0" rx="2"/>
<rect class="s3" x="250.0" y="229.0" width="393.4" height="10.0" rx="2"/>
<text class="ink small" x="649.4" y="238.0">+69%</text>
<text class="ink" x="238" y="278.0" text-anchor="end">Q5 · value per +$10k income</text>
<rect class="s1" x="250.0" y="257.0" width="69.6" height="10.0" rx="2"/>
<rect class="s2" x="250.0" y="269.0" width="173.9" height="10.0" rx="2"/>
<rect class="s3" x="250.0" y="281.0" width="347.8" height="10.0" rx="2"/>
<text class="ink small" x="603.8" y="290.0">+61%</text>
<text class="ink-2 small" x="24.0" y="342.0">Q3 (share worth $600k+) is not shown: it is recorded as 0%, so a % change can’t be computed.</text>
<text class="ink-2 small" x="24.0" y="360.0">Its true value lies somewhere between 0% and 4.68%.</text>
</svg>